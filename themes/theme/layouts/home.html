{{ define "main" }}
<div class="main-content">
  {{ .Content }}
</div>

<div class="main-content">
  <h2>My Recent Posts</h2>
  {{ range site.RegularPages }}
  <section class="blog-container">
    <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
    {{ .Summary }}
  </section>
  {{ end }}
</div>
{{ end }}
